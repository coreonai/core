[workspace]
resolver = "2"
members = [
    "nanogpt-rs",
    "llm-actors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["paulyu"]
license = "Apache-2.0"

[workspace.dependencies]
candle-core      = "0.10"
candle-nn        = "0.10"
candle-transformers = "0.10"
tokenizers       = "0.23"
tokio            = { version = "1.47", features = ["full"] }
async-trait      = "0.1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tracing          = "0.1"
tracing-subscriber = "0.3"
anyhow           = "1"
thiserror        = "2"
rand             = "0.8"
indicatif        = "0.17"
clap             = { version = "4", features = ["derive"] }
axum             = "0.8"

# pekko-rust (separate workspace at ../AgenticAI/rust_pekko)
pekko-actor = { path = "../AgenticAI/rust_pekko/pekko-actor" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

# Vendored, patched candle-core 0.10.2: matmul backward skips the gradient
# for a frozen (non-variable) operand. Cuts LoRA training peak memory from
# ~4x the base to ~1.2x, so Qwen2.5-Coder-7B LoRA SFT fits a 40GB A100
# (~15GB vs OOM). Single-hunk diff vs upstream in
# vendor/candle-core-0.10.2/PATCH.md; upstream PR pending. Drop this
# [patch] once the fix is released upstream.
[patch.crates-io]
candle-core = { path = "vendor/candle-core-0.10.2" }

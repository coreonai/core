name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: cargo test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The workspace pulls pekko-actor by path from a sibling directory
      # (../AgenticAI/rust_pekko/pekko-actor, see Cargo.toml). The upstream
      # repo coreonai/rust_pekko is private, so the default GITHUB_TOKEN
      # cannot read it: a secret holding a read-only token is required.
      #
      # One-time setup: create a fine-grained PAT (or machine-user token)
      # with "Contents: read" on coreonai/rust_pekko only, and store it as
      # the repository secret RUST_PEKKO_READ_TOKEN.
      #
      # Pinned to the last rust_pekko commit before pekko-actor's `Actor`
      # trait switched from a hand-written `Pin<Box<dyn Future>>` receive()
      # to #[async_trait] (ca3c3bd); llm-actors still implements the former.
      # Bump this (and port llm-actors) when moving to newer pekko-actor.
      - name: Check pekko-rust token is configured
        env:
          RUST_PEKKO_READ_TOKEN: ${{ secrets.RUST_PEKKO_READ_TOKEN }}
        run: |
          if [ -z "$RUST_PEKKO_READ_TOKEN" ]; then
            echo "::error::Secret RUST_PEKKO_READ_TOKEN is not available. It must be a read-only token for coreonai/rust_pekko (private). Secrets are also not exposed to PRs from forks."
            exit 1
          fi

      - name: Checkout pekko-rust (path dep)
        uses: actions/checkout@v4
        with:
          repository: coreonai/rust_pekko
          ref: 4eff710ebee4ead3667393f656b7e8020826f965
          token: ${{ secrets.RUST_PEKKO_READ_TOKEN }}
          # Must live inside $GITHUB_WORKSPACE; moved to the sibling path
          # the workspace expects in the next step.
          path: .ci/rust_pekko

      - name: Place pekko-rust at ../AgenticAI/rust_pekko
        run: |
          mkdir -p ../AgenticAI
          mv .ci/rust_pekko ../AgenticAI/rust_pekko
          rmdir .ci
          ls ../AgenticAI/rust_pekko/pekko-actor/src

      - name: Format check
        # Strict: fmt drift is a build break.
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace --release

      - name: cargo test --workspace
        run: cargo test --workspace --release

      - name: cargo build --workspace --examples (sanity)
        run: cargo build --workspace --examples --release

      - name: cargo clippy
        # Strict gate: any clippy warning is a build break. Workspace
        # is currently at zero clippy warnings (workLLM K3 sweep).
        run: cargo clippy --workspace --all-targets -- -D warnings
